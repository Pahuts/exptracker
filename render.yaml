# Render deployment config (Blueprint).
# In Render: New + -> Blueprint -> connect this repo. Render reads this file.
services:
  - type: web
    name: expense-tracker
    runtime: node
    plan: free
    # Seed the database (idempotent) then start the server.
    buildCommand: npm install
    startCommand: node seed.js && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      # Neon/Supabase/Postgres connection string.
      # Example: postgres://user:pass@host/db?sslmode=require
      - key: DATABASE_URL
        sync: false
      # Generated automatically by Render; keeps cookies valid across restarts.
      - key: SESSION_SECRET
        generateValue: true
      # Set these two in the Render dashboard (do NOT commit real values).
      # Generate them locally with: npm run hash-password
      - key: PASSWORD_SALT
        sync: false
      - key: PASSWORD_HASH
        sync: false
