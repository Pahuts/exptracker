<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GA1LEN4LD · Expense Tracker</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">₱</span>
      <div>
        <h1>GA1LEN4LD Budget Tracker</h1>
        <p>Grand Royale · Malolos, Bulacan</p>
      </div>
    </div>
    <div class="topbar-actions">
      <button id="addBtn" class="btn btn-primary">+ Add Expense</button>
      <button id="logoutBtn" class="btn">Log out</button>
    </div>
  </header>

  <main>
    <!-- Scope selector: filters cards, charts, and table together -->
    <section class="scope-bar">
      <label for="scope">Viewing</label>
      <select id="scope">
        <option value="all">All Expenses</option>
        <option value="house">🏠 House</option>
        <option value="wedding">💍 Wedding</option>
      </select>
    </section>

    <!-- Summary cards -->
    <section class="cards" id="cards"></section>

    <!-- Charts -->
    <section class="charts">
      <div class="chart-card wide">
        <h3>Monthly Payments Over Time</h3>
        <canvas id="monthlyChart"></canvas>
      </div>
      <div class="chart-card">
        <h3>Total by Category</h3>
        <canvas id="categoryChart"></canvas>
      </div>
      <div class="chart-card">
        <h3>Paid vs Unpaid</h3>
        <canvas id="statusChart"></canvas>
      </div>
      <div class="chart-card">
        <h3>Contribution by Payer</h3>
        <canvas id="payerChart"></canvas>
      </div>
    </section>

    <!-- Filters + table -->
    <section class="table-section">
      <div class="table-toolbar">
        <h2>Expenses</h2>
        <div class="filters">
          <input type="search" id="search" placeholder="Search description…" />
          <select id="filterCategory"><option value="">All categories</option></select>
          <select id="filterPayer">
            <option value="">All payers</option>
            <option>Gaile</option>
            <option>Nald</option>
            <option>Both</option>
          </select>
          <select id="filterStatus">
            <option value="">All statuses</option>
            <option>Paid</option>
            <option>Unpaid</option>
            <option>Planned</option>
          </select>
          <select id="filterYear"><option value="">All years</option></select>
        </div>
      </div>
      <div class="table-wrap">
        <table id="table">
          <thead>
            <tr>
              <th class="sortable" data-sort="date">Date <span class="sort-ind"></span></th>
              <th>Category</th>
              <th>Description</th>
              <th>Payer</th>
              <th class="num sortable" data-sort="amount">Amount <span class="sort-ind"></span></th>
              <th>Status</th>
              <th class="actions-col">Actions</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
        <p id="emptyState" class="empty hidden">No matching expenses.</p>
      </div>
    </section>
  </main>

  <!-- Modal -->
  <div class="modal-backdrop hidden" id="modal">
    <div class="modal">
      <h2 id="modalTitle">Add Expense</h2>
      <form id="form">
        <input type="hidden" id="expenseId" />
        <label>
          Category
          <input list="categoryList" id="category" required placeholder="e.g. Titling Fee" />
          <datalist id="categoryList"></datalist>
        </label>
        <div class="row">
          <label>
            Payer
            <select id="payer">
              <option>Gaile</option>
              <option>Nald</option>
              <option selected>Both</option>
            </select>
          </label>
          <label>
            Status
            <select id="status">
              <option>Paid</option>
              <option selected>Unpaid</option>
              <option>Planned</option>
            </select>
          </label>
        </div>
        <label>
          Description
          <input id="description" placeholder="e.g. March 28" />
        </label>
        <div class="row">
          <label>
            Amount (₱)
            <input id="amount" type="number" step="0.01" min="0" required />
          </label>
          <label>
            Date
            <input id="date" type="date" />
          </label>
        </div>
        <p class="form-error hidden" id="formError"></p>
        <div class="modal-actions">
          <button type="button" class="btn" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveBtn">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
