<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in · GA1LEN4LD</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(120deg, #4f46e5, #7c3aed);
      color: #0f172a;
    }
    .login {
      background: #fff;
      width: 100%;
      max-width: 380px;
      margin: 20px;
      padding: 32px 28px;
      border-radius: 18px;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.3);
    }
    .logo {
      width: 52px; height: 52px;
      display: grid; place-items: center;
      border-radius: 14px;
      background: linear-gradient(120deg, #4f46e5, #7c3aed);
      color: #fff; font-size: 26px; font-weight: 700;
      margin-bottom: 18px;
    }
    h1 { margin: 0 0 4px; font-size: 20px; }
    p.sub { margin: 0 0 22px; color: #64748b; font-size: 14px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #64748b; margin-bottom: 6px; }
    .field { position: relative; }
    input {
      width: 100%;
      padding: 11px 42px 11px 12px;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      font-size: 15px;
    }
    input:focus { outline: none; border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79,70,229,0.15); }
    .toggle {
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      border: none; background: transparent; cursor: pointer; font-size: 16px; padding: 4px;
    }
    button.submit {
      width: 100%;
      margin-top: 18px;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #4f46e5;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;
    }
    button.submit:hover { background: #4338ca; }
    button.submit:disabled { opacity: 0.6; cursor: default; }
    .error {
      margin-top: 14px;
      color: #dc2626;
      font-size: 13px;
      min-height: 18px;
    }
  </style>
</head>
<body>
  <form class="login" id="loginForm" autocomplete="off">
    <div class="logo">₱</div>
    <h1>House Budget Tracker</h1>
    <p class="sub">Enter the password to continue.</p>
    <label for="password">Password</label>
    <div class="field">
      <input type="password" id="password" name="password" required autofocus />
      <button type="button" class="toggle" id="toggle" title="Show/hide" aria-label="Show password">👁️</button>
    </div>
    <button type="submit" class="submit" id="submit">Sign in</button>
    <div class="error" id="error"></div>
  </form>

  <script>
    const form = document.getElementById('loginForm');
    const pw = document.getElementById('password');
    const err = document.getElementById('error');
    const submit = document.getElementById('submit');

    document.getElementById('toggle').addEventListener('click', () => {
      pw.type = pw.type === 'password' ? 'text' : 'password';
      pw.focus();
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.textContent = '';
      submit.disabled = true;
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pw.value }),
        });
        if (res.ok) {
          window.location.href = '/';
        } else {
          const data = await res.json().catch(() => ({}));
          err.textContent = data.error || 'Incorrect password';
          pw.select();
        }
      } catch {
        err.textContent = 'Network error. Try again.';
      } finally {
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
